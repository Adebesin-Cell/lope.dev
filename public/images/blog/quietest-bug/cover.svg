<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="family?.familyName ?? dash — optional chaining silently resolving a missing value to a dash">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <text x="80" y="120" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" letter-spacing="6" fill="#6b6b75">OPTIONAL CHAINING</text>

  <text x="80" y="330" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="62" font-weight="500">
    <tspan fill="#fafafa">family</tspan><tspan fill="#e0a05e">?.</tspan><tspan fill="#fafafa">familyName</tspan><tspan fill="#6b6b75"> ?? </tspan><tspan fill="#e0a05e">"—"</tspan>
  </text>

  <text x="80" y="420" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" fill="#6b6b75">no error. no log. just a dash.</text>

  <text x="80" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#a1a1aa" font-style="italic">The bug you never see.</text>
</svg>
