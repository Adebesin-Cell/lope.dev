<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
<title id="t">Build once, at build time. Most styling makes the browser pay the rent. Panda pays it up front.</title>
<defs>
<radialGradient id="bp" cx="50%" cy="50%"><stop offset="0%" stop-color="#ffd23f" stop-opacity="1"/><stop offset="45%" stop-color="#ffd23f" stop-opacity=".55"/><stop offset="100%" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
<radialGradient id="bo" cx="50%" cy="50%"><stop offset="0%" stop-color="#ff8a5c" stop-opacity=".9"/><stop offset="45%" stop-color="#ff8a5c" stop-opacity=".45"/><stop offset="100%" stop-color="#ff8a5c" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17171b" flood-opacity=".12"/></filter>
<style>
.d { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; letter-spacing: -0.035em; fill: #17171b; }
.l { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #33333a; }
.e { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 2.7px; fill: #63636f; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; fill: #17171b; }
.mb { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; font-weight: 700; fill: #ffffff; }
</style>
</defs>

<rect width="1200" height="630" fill="#faf9f5"/>
<ellipse cx="105" cy="80" rx="330" ry="285" fill="url(#bp)"/>
<ellipse cx="1105" cy="565" rx="330" ry="285" fill="url(#bo)"/>

<g opacity=".95">
  <g transform="translate(126,104) rotate(-8)"><image href="data:image/svg+xml;base64," width="150" height="44"/></g>
  <g transform="translate(966,112) rotate(10)"><image href="data:image/svg+xml;base64," width="56" height="56"/></g>
  <g transform="translate(96,482) rotate(-5)" filter="url(#sh)"><rect width="196" height="48" rx="12" fill="#ffffff"/><text class="m" x="18" y="30">css({ … })</text></g>
  <g transform="translate(880,470) rotate(7)" filter="url(#sh)"><rect width="250" height="48" rx="24" fill="#17171b"/><text class="mb" x="125" y="30" text-anchor="middle">3.8 MB → 2 rules</text></g>
<text x="86" y="300" font-size="30" opacity=".9">✨</text>
<text x="1084" y="372" font-size="26" opacity=".9">✨</text>
<text x="556" y="580" font-size="34">🐼</text>
</g>

<text class="e" x="600" y="216" text-anchor="middle">PANDA CSS</text>
<text class="d" x="600" y="322" text-anchor="middle" font-size="76">Build once,</text>
<text class="d" x="600" y="404" text-anchor="middle" font-size="76">at build time</text>
<text class="l" x="600" y="462" text-anchor="middle" font-size="26">Most styling makes the browser pay the rent.</text>
</svg>
