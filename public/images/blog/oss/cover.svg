<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A chat box with a half-typed &quot;Hi&quot; and a blinking cursor, the send button just out of reach.">
  <style>
    :root{
      --bg:#0a0a0a; --ink:#fafafa; --muted:#71717a;
      --dot:rgba(255,255,255,0.07); --card:#141414;
      --border:rgba(255,255,255,0.12); --send:rgba(255,255,255,0.05);
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#fafafa; --ink:#0a0a0a; --muted:#6b6b75;
        --dot:rgba(0,0,0,0.08); --card:#ffffff;
        --border:rgba(0,0,0,0.12); --send:rgba(0,0,0,0.04);
      }
    }
    .bg{fill:var(--bg)}
    .ink{fill:var(--ink)}
    .muted{fill:var(--muted)}
    .card{fill:var(--card);stroke:var(--border);stroke-width:1.5}
    .send{fill:var(--send);stroke:var(--border);stroke-width:1.5}
    .arrow{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .hi{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:46px}
    .kicker{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;letter-spacing:.5px}
    .caret{fill:var(--ink);animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.caret{animation:none}}
  </style>

  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="var(--dot)"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="600"/>
  <rect x="0" y="0" width="1200" height="600" fill="url(#dots)"/>

  <!-- kicker -->
  <text class="kicker muted" x="222" y="238">the hardest two letters in open source</text>

  <!-- chat input -->
  <rect class="card" x="220" y="258" width="760" height="104" rx="24" filter="url(#soft)"/>
  <text class="hi ink" x="266" y="326">Hi</text>
  <rect class="caret" x="330" y="286" width="3" height="48" rx="1.5"/>

  <!-- send button, dimmed / out of reach -->
  <circle class="send" cx="922" cy="310" r="34"/>
  <path class="arrow" d="M922 326 V294 M910 306 L922 294 L934 306"/>
</svg>
